<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha coleção</title>

    <link rel="stylesheet" href="/frontend/css/perfil.css">
</head>

<body>

    <header class="header">

        <a href="/frontend/index.html" class="logo">
            Mangá Livre
        </a>

        <a href="/frontend/pages/cadastroManga.html" class="btn-header">
            Novo mangá
        </a>

    </header>


    <main class="pagina">

        <section class="perfil-intro">

            <div class="perfil-nome">

                <span>
                    Minha estante
                </span>

                <h1>
                    Minhão
                </h1>

                <p>
                    Um espaço para guardar os mangás
                    que fazem parte da minha coleção.
                </p>

            </div>

        </section>


        <section class="colecao">

            <div class="colecao-topo">

                <div>

                    <span>
                        BIBLIOTECA PESSOAL
                    </span>


                </div>

            </div>


            <div id="listaMangas" class="estante">
            </div>


            <div id="semMangas" class="estante-vazia">

                <h3>
                    Ainda não tem nada aqui.
                </h3>

                <p>
                    Comece sua coleção adicionando
                    o primeiro mangá.
                </p>

                <a
                    href="/frontend/pages/cadastroManga.html"
                    class="botao-vazio"
                >
                    Adicionar primeiro mangá
                </a>

            </div>

        </section>

    </main>


    <footer>

        <p>
            © 2026 Mangá Livre
        </p>

    </footer>


    <script src="/frontend/js/perfil.js"></script>

</html>
